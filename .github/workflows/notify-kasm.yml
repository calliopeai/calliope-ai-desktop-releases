name: Notify Kasm on Release

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Parse release tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          # Expected format: {product}-v{version} e.g. ide-v1.5.0
          PRODUCT="${TAG%%-v*}"
          VERSION="${TAG#*-v}"

          # Validate product is one we care about
          case "$PRODUCT" in
            ide|lab|chat|loadr) ;;
            *) echo "Tag $TAG is not a tracked product — skipping"; exit 0 ;;
          esac

          echo "product=$PRODUCT" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Parsed: product=$PRODUCT version=$VERSION"

      - name: Dispatch product rebuild to kasm
        if: steps.tag.outputs.product != ''
        run: |
          PRODUCT="${{ steps.tag.outputs.product }}"
          VERSION="${{ steps.tag.outputs.version }}"

          echo "Triggering kasm rebuild: ${PRODUCT} v${VERSION}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_CALLIOPE_CI }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/calliopeai/calliope-kasm/dispatches \
            -d "{\"event_type\":\"${PRODUCT}-release\",\"client_payload\":{\"version\":\"${VERSION}\"}}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          echo "HTTP $HTTP_CODE"
          [ "$HTTP_CODE" = "204" ] || echo "::warning::Dispatch failed (HTTP $HTTP_CODE)"

      - name: Dispatch suite rebuild to kasm
        if: steps.tag.outputs.product != ''
        run: |
          PRODUCT="${{ steps.tag.outputs.product }}"
          VERSION="${{ steps.tag.outputs.version }}"
          SUITE_VERSION="$(date -u +%Y.%m.%d)"

          # Build suite payload — set the updated component, leave others blank (Dockerfile defaults)
          case "$PRODUCT" in
            ide)   PAYLOAD="{\"version\":\"${SUITE_VERSION}\",\"ide_version\":\"${VERSION}\",\"lab_version\":\"\",\"chat_version\":\"\",\"loadr_version\":\"\"}" ;;
            lab)   PAYLOAD="{\"version\":\"${SUITE_VERSION}\",\"ide_version\":\"\",\"lab_version\":\"${VERSION}\",\"chat_version\":\"\",\"loadr_version\":\"\"}" ;;
            chat)  PAYLOAD="{\"version\":\"${SUITE_VERSION}\",\"ide_version\":\"\",\"lab_version\":\"\",\"chat_version\":\"${VERSION}\",\"loadr_version\":\"\"}" ;;
            loadr) PAYLOAD="{\"version\":\"${SUITE_VERSION}\",\"ide_version\":\"\",\"lab_version\":\"\",\"chat_version\":\"\",\"loadr_version\":\"${VERSION}\"}" ;;
          esac

          echo "Triggering kasm suite rebuild (${PRODUCT} updated to v${VERSION}, suite v${SUITE_VERSION})"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_CALLIOPE_CI }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/calliopeai/calliope-kasm/dispatches \
            -d "{\"event_type\":\"suite-release\",\"client_payload\":${PAYLOAD}}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          echo "HTTP $HTTP_CODE"
          [ "$HTTP_CODE" = "204" ] || echo "::warning::Suite dispatch failed (HTTP $HTTP_CODE)"
